name: Update Google review count

on:
  schedule:
    # Once daily, ~9am Atlantic time (12:00 UTC during ADT / 13:00 during AST)
    - cron: "0 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-reviews:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch current rating/review count and update pages
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: python scripts/update_review_count.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "washcrafters-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update Google review count/rating"
            git push
          fi
